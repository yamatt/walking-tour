version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "yamatt"
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependency
      - npm
    
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "yamatt"
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependency
      - github-actions
